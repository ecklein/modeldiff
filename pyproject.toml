[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modeldiff-ml"
version = "0.2.0"
description = "Behavioral regression testing for machine-learning models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Ethan Klein", email = "ethan.kleinc@gmail.com"}]
keywords = ["machine-learning", "model-comparison", "regression-testing", "statistics"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ecklein/modeldiff-ml"
Repository = "https://github.com/ecklein/modeldiff-ml"
Issues = "https://github.com/ecklein/modeldiff-ml/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "scipy-stubs>=1.10",
  "scikit-learn>=1.4",
]

[project.scripts]
modeldiff-ml = "modeldiff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modeldiff"]

[tool.pytest.ini_options]
addopts = "-q --cov=modeldiff --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/modeldiff/reporting/html.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["modeldiff"]
